apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: backend-service
  namespace: "default"
  labels:
    env: production
    managed-by: gcp-multiagent-scrum-team
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      labels:
        version: v1-0-0
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: cloud-run-sa@my-gcp-project-id.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: backend-container
          image: us-central1-docker.pkg.dev/my-gcp-project-id/scrum-team-repo/backend-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          env:
            - name: GCP_PROJECT_ID
              value: "my-gcp-project-id"
            - name: GCP_REGION
              value: "us-central1"
            - name: ENVIRONMENT
              value: "production"
            - name: ADK_LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: github-app-private-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
