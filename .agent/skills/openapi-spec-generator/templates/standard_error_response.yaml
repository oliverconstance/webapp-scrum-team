# Standard RFC 7807 Problem Details Schema for OpenAPI 3.1
# Reference: https://datatracker.ietf.org/doc/html/rfc7807
openapi: 3.1.0
info:
  title: Standard RFC 7807 Problem Details Template
  version: 1.0.0
  description: OpenAPI 3.1 specification template demonstrating RFC 7807 problem details schema.
paths:
  /example-error:
    get:
      summary: Example error response endpoint
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem type.
          default: "about:blank"
          examples:
            - "https://api.example.com/errors/not-found"
            - "https://api.example.com/errors/validation-failed"
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem.
          examples:
            - "Resource Not Found"
            - "Request Validation Failure"
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 100
          maximum: 599
          examples:
            - 404
            - 400
        detail:
          type: [string, "null"]
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - "The requested order with ID 'ord_12345' does not exist in project 'my-gcp-project'."
            - "Field 'email' is missing or formatted incorrectly."
        instance:
          type: [string, "null"]
          format: uri-reference
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          examples:
            - "/v1/orders/ord_12345"
        errors:
          type: array
          description: Optional list of detailed validation or domain error messages.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Name of the field causing the error.
                examples: ["email"]
              message:
                type: string
                description: Specific description of why the field value is invalid.
                examples: ["Must be a valid email address."]
      additionalProperties: true
