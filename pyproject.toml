[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gcp-multiagent-scrum-team"
version = "1.0.0"
description = "GCP-native multi-agent software development team built with Google Agent Development Kit (ADK) and Vertex AI Agent Engine"
authors = ["Principal GCP Engineer <architect@example.com>"]
readme = "README.md"
packages = [
    { include = "agents" },
    { include = "tools" },
    { include = "orchestration" },
]

[tool.poetry.dependencies]
python = "^3.11"
google-genai = "^0.3.0"
google-cloud-secret-manager = "^2.20.0"
google-cloud-storage = "^2.18.0"
google-cloud-aiplatform = "^1.70.0"
PyGithub = "^2.3.0"
pydantic = "^2.8.0"
"ruamel.yaml" = "^0.18.6"
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests isolated from external GCP/GitHub services",
    "integration: Integration tests interacting with GCP services or emulators",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
