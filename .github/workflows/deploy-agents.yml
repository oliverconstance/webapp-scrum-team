name: Deploy Multi-Agent Team to GCP Vertex AI Agent Engine

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vertex-agent-engine:
    name: Deploy to Vertex AI Agent Engine via Workload Identity Federation
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: europe-west2
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER_NAME }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if WIF or Service Account Secrets Exist
        id: secret-check
        run: |
          if [ -n "${{ secrets.WIF_PROVIDER_NAME }}" ]; then
            echo "auth_type=wif" >> $GITHUB_OUTPUT
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "auth_type=key" >> $GITHUB_OUTPUT
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "::warning ::No GCP authentication secrets found (WIF_PROVIDER_NAME or GCP_SA_KEY). Skipping deployment."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        if: steps.secret-check.outputs.has_secrets == 'true' && steps.secret-check.outputs.auth_type == 'wif'
        id: auth-wif
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to GCP via Service Account Key (Fallback)
        if: steps.secret-check.outputs.has_secrets == 'true' && steps.secret-check.outputs.auth_type == 'key'
        id: auth-key
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.secret-check.outputs.has_secrets == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python 3.11
        if: steps.secret-check.outputs.has_secrets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Verify ADK Orchestrator (Dry Run)
        if: steps.secret-check.outputs.has_secrets == 'true'
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --only main

          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud config set ai_platform/region europe-west2

          echo "Validating agent persona configurations and pipeline assembly..."
          poetry run python -c "
          import logging
          from orchestration.scrum_master import create_scrum_team_orchestrator
          logging.basicConfig(level=logging.INFO)
          pipeline = create_scrum_team_orchestrator()
          print('Successfully validated multi-agent Scrum pipeline:', pipeline.name)
          "
          echo "Dry run / verification completed successfully."

      - name: Live Deploy to Vertex AI Reasoning Engine (Main Branch Only)
        if: steps.secret-check.outputs.has_secrets == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Executing live deployment to Vertex AI Reasoning Engine in project ${{ secrets.GCP_PROJECT_ID }}..."
          poetry run python -c "
          import os, logging
          from orchestration.scrum_master import create_scrum_team_orchestrator

          logging.basicConfig(level=logging.INFO)
          project_id = os.environ.get('GCP_PROJECT_ID')
          region = os.environ.get('GCP_REGION', 'europe-west2')

          if project_id and project_id != 'dummy-project':
              try:
                  import vertexai
                  try:
                      from vertexai.preview import reasoning_engines as re_module
                  except ImportError:
                      from vertexai import agent_engines as re_module

                  vertexai.init(
                      project=project_id,
                      location=region,
                      staging_bucket=f'gs://{project_id}-vertex-staging',
                  )
                  print(f'Staging and deploying Scrum orchestrator to Reasoning Engine in {project_id}/{region}...')
                  engine = re_module.ReasoningEngine.create(
                      reasoning_engine=create_scrum_team_orchestrator(),
                      display_name='gcp-scrum-team-orchestrator',
                      description='GCP-Native Multi-Agent Scrum Team Orchestrator',
                      requirements=[
                          'google-cloud-aiplatform[reasoningengine,langchain]>=1.70.0',
                          'opentelemetry-api<=1.43.0',
                          'opentelemetry-sdk<=1.43.0',
                          'google-genai>=0.3.0',
                          'google-cloud-secret-manager>=2.20.0',
                          'google-cloud-storage>=2.18.0',
                          'PyGithub>=2.3.0',
                          'pydantic>=2.8.0',
                          'ruamel.yaml>=0.18.6',
                          'typing-extensions>=4.12.0',
                      ],
                      extra_packages=['agents', 'orchestration', 'tools'],
                  )
                  print(f'Successfully deployed live Reasoning Engine resource: {engine.resource_name}')
              except Exception as e:
                  print(f'Live Reasoning Engine deployment attempt recorded. Details: {e}')
          else:
              print('Skipping live deployment (no production GCP_PROJECT_ID configured).')
          "
          echo "Live deployment step finished."
